# Pegboard 配置示例。
# 配置发现链：--config / $PEGBOARD_CONFIG → ./config.toml（开发树）→
# 平台配置目录（macOS ~/Library/Application Support/Pegboard、Linux
# ~/.config/pegboard、Windows %APPDATA%/Pegboard）→ 全默认。
# 命中平台配置目录或全默认时，下方相对路径重定基到平台数据区；
# cwd 配置的相对路径相对 cwd（开发树行为）。
#
# listen 绑 127.0.0.1 = 仅本机；绑 0.0.0.0 或局域网 IP = 局域网可达。
# 局域网开放时建议在管理页设置访问密码（保护 /api/admin/*，应用页面不受影响）。

[server]
listen = "127.0.0.1:8787"

[limits]
kv_value_bytes = 1048576
kv_total_bytes = 10485760
file_bytes = 104857600
file_total_bytes = 1073741824
net_rps = 20
sign_ttl_max = 86400

[storage]
data_root = "./data"
apps_dir = "./apps"
