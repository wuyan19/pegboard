<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pegboard 管理台</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><rect width="16" height="16" rx="4" fill="%232563eb"/><circle cx="8" cy="8" r="3.4" fill="none" stroke="white" stroke-width="1.7"/><circle cx="8" cy="8" r="1.2" fill="white"/></svg>'>
<style>
  /* 设计基调：极简 / 瑞士网格（开发者运维台）。深色为一等主题，浅色同套 token。 */
  :root {
    color-scheme: light dark;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --bg: #f1f5f9;
    --card: #ffffff;
    --fg: #0f172a;
    --muted: #475569;
    --faint: #64748b;
    --border: #e2e8f0;
    --border-strong: #cbd5e1;
    --hover: #f1f5f9;
    --accent: #2563eb;
    --ring: #2563eb;
    --err: #dc2626;
    --ok-bg: #dcfce7;   --ok-fg: #166534;
    --warn-bg: #fef3c7; --warn-fg: #92400e;
    --err-bg: #fee2e2;  --err-fg: #991b1b;
    --dim-bg: #e2e8f0;  --dim-fg: #334155;
    --track: #e2e8f0;
    --shadow: 0 1px 2px rgba(15, 23, 42, .05);
    --shadow-lg: 0 16px 48px rgba(15, 23, 42, .22);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --card: #1b2336;
      --fg: #f8fafc;
      --muted: #94a3b8;
      --faint: #7e8ca3;
      --border: #2a3550;
      --border-strong: #475569;
      --hover: #242e47;
      --accent: #60a5fa;
      --ring: #93c5fd;
      --err: #f87171;
      --ok-bg: rgba(74, 222, 128, .13);   --ok-fg: #4ade80;
      --warn-bg: rgba(251, 191, 36, .13); --warn-fg: #fbbf24;
      --err-bg: rgba(248, 113, 113, .15); --err-fg: #f87171;
      --dim-bg: rgba(148, 163, 184, .16); --dim-fg: #cbd5e1;
      --track: rgba(148, 163, 184, .22);
      --shadow: none;
      --shadow-lg: 0 16px 48px rgba(0, 0, 0, .5);
    }
  }
  * { box-sizing: border-box; }
  body {
    font: 14px/1.55 var(--sans);
    margin: 0 auto;
    max-width: 1160px;
    padding: 20px 24px 56px;
    background: var(--bg);
    color: var(--fg);
  }
  :focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  ::placeholder { color: var(--faint); }

  /* 页头 */
  .page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 8px; }
  h1 { font-size: 18px; font-weight: 650; letter-spacing: -.01em; margin: 0; }
  .sub { color: var(--faint); font-size: 12px; margin-top: 3px; }
  .head-meta { display: flex; align-items: center; gap: 10px; padding-top: 3px; }
  #status { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

  h2 { font-size: 15px; font-weight: 600; margin: 26px 0 4px; display: flex; align-items: baseline; gap: 8px; }
  .count { font-size: 12px; font-weight: 400; color: var(--faint); }
  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 10px 0; }
  .hint { color: var(--faint); font-size: 12px; margin: 8px 2px 0; }
  .muted { color: var(--muted); }

  /* 控件 */
  button, select, input {
    font: inherit; font-size: 13px; line-height: 1.2; padding: 6px 12px;
    border-radius: 8px; border: 1px solid var(--border-strong);
    background: var(--card); color: var(--fg);
    transition: background-color .15s ease, border-color .15s ease;
  }
  button { cursor: pointer; }
  button:hover:not(:disabled) { background: var(--hover); }
  button:disabled { opacity: .45; cursor: default; }
  button.danger { color: var(--err); border-color: currentColor; }
  button.danger:hover:not(:disabled) { background: var(--err-bg); }
  @media (pointer: coarse) { button, select, input { min-height: 44px; } }

  /* 表格 */
  .table-wrap {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: var(--shadow); overflow-x: auto;
  }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: top; }
  thead th { font-weight: 600; color: var(--muted); font-size: 12px; white-space: nowrap; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr { transition: background-color .12s ease; }
  tbody tr.clickable { cursor: pointer; }
  @media (hover: hover) { tbody tr.clickable:hover { background: var(--hover); } }
  tbody tr.clickable:focus-visible { outline-offset: -2px; }
  td[colspan] { padding: 18px 14px; color: var(--faint); }
  #logs { min-width: 820px; }
  /* 状态与操作列不换行，操作按钮保持一行 */
  #apps td:nth-child(2), #apps td:last-child { white-space: nowrap; }
  td { font-variant-numeric: tabular-nums; }
  code, .mono { font-family: var(--mono); font-size: 12px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* 状态徽章 */
  .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 500; line-height: 1.5; white-space: nowrap; }
  .ok { background: var(--ok-bg); color: var(--ok-fg); }
  .warn { background: var(--warn-bg); color: var(--warn-fg); }
  .err { background: var(--err-bg); color: var(--err-fg); }
  .dim { background: var(--dim-bg); color: var(--dim-fg); }

  /* 用量条（数值在文本中，色条仅辅助） */
  .usage-row { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
  .usage-label { flex: none; width: 40px; color: var(--muted); }
  .usage-bar { flex: none; height: 8px; width: 150px; background: var(--track); border-radius: 4px; overflow: hidden; }
  .usage-fill { display: block; height: 100%; background: var(--accent); }
  .usage-num { font-size: 12px; color: var(--muted); }

  /* 模态框 */
  #modal { position: fixed; inset: 0; z-index: 10; display: flex; align-items: flex-start; justify-content: center; padding: 48px 16px; }
  #modal[hidden] { display: none; }
  #modal-backdrop { position: absolute; inset: 0; background: rgba(2, 6, 23, .55); }
  #modal-card {
    position: relative; width: 660px; max-width: 100%; max-height: 82vh; overflow-y: auto;
    background: var(--card); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-lg);
  }
  #modal-head {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    position: sticky; top: 0; background: var(--card); border-radius: 12px 12px 0 0;
  }
  #modal-close { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; padding: 0; }
  #modal-body { padding: 16px 20px 20px; }
  #modal-body h3 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 0 8px; }
  #modal-body h3:first-child { margin-top: 0; }
  .fact-box {
    font-family: var(--mono); font-size: 12px; line-height: 1.9;
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
  }
  .kv-table { width: 100%; border-collapse: collapse; }
  .kv-table td { padding: 5px 8px 5px 0; border: none; font-size: 13px; vertical-align: top; }
  .kv-table td:first-child { color: var(--muted); width: 96px; white-space: nowrap; }
  .kv-table td:last-child { overflow-wrap: anywhere; }

  @keyframes fade-in { from { opacity: 0; } }
  @keyframes pop-in { from { opacity: 0; transform: translateY(10px) scale(.985); } }
  @media (prefers-reduced-motion: no-preference) {
    #modal:not([hidden]) #modal-backdrop { animation: fade-in .15s ease-out; }
    #modal:not([hidden]) #modal-card { animation: pop-in .18s cubic-bezier(.2, .9, .3, 1); }
  }

  @media (max-width: 720px) {
    body { padding: 16px 12px 40px; }
    th, td { padding: 8px 10px; }
    #modal { padding: 16px 8px; }
    #modal-body { padding: 12px 14px 16px; }
  }
</style>
</head>
<body>
<header class="page-head">
  <div>
    <h1>Pegboard 管理台</h1>
    <div class="sub">宿主管理 · 应用 / 权限 / 限额 / 审计日志（只读元数据，无业务数据）· <span id="server-info"></span></div>
  </div>
  <div class="head-meta">
    <span id="status">加载中…</span>
    <button id="refresh" title="立即刷新（每 10 秒自动刷新）">刷新</button>
  </div>
</header>

<h2>应用 <span class="count" id="app-count"></span></h2>
<div class="bar">
  <input id="install-id" placeholder="应用 id（apps/ 目录名）" size="26" aria-label="应用 id（apps/ 目录名）" autocapitalize="none" spellcheck="false">
  <button id="install">安装</button>
  <span class="muted">或</span>
  <input type="file" id="package" accept=".zip" hidden>
  <button id="upload-package" title="上传 zip 应用包（包根含 manifest.json）">上传安装包</button>
  <span class="muted" id="install-msg" aria-live="polite">按清单校验后注册；失败会显示原因</span>
</div>
<div class="table-wrap">
  <table id="apps">
    <thead><tr><th>应用</th><th>状态</th><th>操作</th></tr></thead>
    <tbody id="apps-body"><tr><td colspan="3">加载中…</td></tr></tbody>
  </table>
</div>
<p class="hint">点击行查看详情（支持 Enter 键）· 禁用后能力 API 返回 APP_NOT_FOUND，静态页面仍可访问 · 卸载保留产物与数据（重装即恢复），删除不可逆。</p>

<h2>审计日志</h2>
<p class="hint" style="margin-top: 0;">能力调用事件（静态访问不入审计）。</p>
<div class="bar">
  <select id="f-app" title="按应用过滤" aria-label="按应用过滤"><option value="">全部应用</option></select>
  <select id="f-action" title="按动作过滤" aria-label="按动作过滤">
    <option value="">全部动作</option>
    <option>Store</option><option>Files</option><option>Net</option>
    <option>Ws</option><option>Admin</option><option>Identity</option>
  </select>
  <select id="f-outcome" title="按结果过滤" aria-label="按结果过滤">
    <option value="">全部结果</option>
    <option>Ok</option><option>Denied</option><option>Error</option>
  </select>
  <select id="f-limit" title="每页条数" aria-label="每页条数">
    <option>20</option><option selected>50</option><option>100</option><option>200</option>
  </select>
  <span class="muted" id="log-page"></span>
  <button id="logs-prev" title="更新的事件" disabled>← 较新</button>
  <button id="logs-next" title="更早的事件" disabled>较旧 →</button>
</div>
<div class="table-wrap">
  <table id="logs">
    <thead><tr><th>时间</th><th>应用</th><th>subject</th><th>动作</th><th>目标</th><th>结果</th><th>错误码</th><th>耗时</th></tr></thead>
    <tbody id="logs-body"><tr><td colspan="8">加载中…</td></tr></tbody>
  </table>
</div>

<h2>宿主 <span class="count" id="host-version"></span></h2>
<div class="bar">
  <button id="update-check">检查更新</button>
  <span class="muted" id="update-msg" aria-live="polite"></span>
  <button id="update-install" hidden>下载并安装</button>
  <button id="host-restart" hidden class="danger" title="重启宿主进程以切换新版本">重启宿主</button>
</div>

<!-- 应用详情模态框 -->
<div id="modal" hidden>
  <div id="modal-backdrop"></div>
  <div id="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div id="modal-head">
      <strong id="modal-title"></strong>
      <button id="modal-close" title="关闭 (Esc)" aria-label="关闭">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);

// 所有插值一律转义：应用名 / 日志字段来自第三方内容（清单、目标域名），防注入
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  })[c]);
}

function adminHeaders(extra) {
  const h = Object.assign({}, extra || {});
  const token = sessionStorage.getItem("pegboard-admin-token");
  if (token) h["Authorization"] = "Bearer " + token;
  return h;
}

async function j(url, opts) {
  const init = Object.assign({}, opts || {});
  init.headers = adminHeaders(init.headers);
  let r = await fetch(url, init);
  // 管理鉴权开启时：提示输入 token 并重试一次
  if (r.status === 401) {
    let body401 = {};
    try { body401 = await r.json(); } catch (_) {}
    if ((body401.error || {}).code === "TOKEN_INVALID") {
      const token = prompt("宿主已启用管理鉴权，请输入管理 token：");
      if (token) {
        sessionStorage.setItem("pegboard-admin-token", token);
        init.headers = adminHeaders(init.headers);
        r = await fetch(url, init);
      }
    }
  }
  if (r.ok) return r.status === 204 ? null : r.json();
  let body = {};
  try { body = await r.json(); } catch (_) {}
  const e = (body && body.error) || {};
  const err = new Error(e.message || r.statusText);
  err.code = e.code;
  err.status = r.status;
  throw err;
}

function fmtBytes(n) {
  if (n >= 1073741824) return (n / 1073741824).toFixed(1) + " GiB";
  if (n >= 1048576) return (n / 1048576).toFixed(1) + " MiB";
  if (n >= 1024) return (n / 1024).toFixed(1) + " KiB";
  return n + " B";
}

function relTime(ts) {
  const d = Date.now() - ts;
  if (!(d >= 0)) return new Date(ts).toLocaleString();
  if (d < 10_000) return "刚刚";
  if (d < 60_000) return Math.round(d / 1000) + " 秒前";
  if (d < 3_600_000) return Math.round(d / 60_000) + " 分钟前";
  if (d < 86_400_000) return Math.round(d / 3_600_000) + " 小时前";
  return Math.round(d / 86_400_000) + " 天前";
}

function setBody(sel, html) {
  $(sel.slice(1)).innerHTML = html;
}

function errorRow(cols, e, retry) {
  const tr = document.createElement("tr");
  tr.innerHTML =
    '<td colspan="' + cols + '">' +
    '<span class="pill err">' + esc(e.code || "ERROR") + "</span> " +
    esc(e.message || e) + " " +
    '<button>重试</button></td>';
  tr.querySelector("button").addEventListener("click", retry);
  return tr;
}

// ---------- 应用列表 ----------

let appsCache = [];

const STATE_LABEL = {
  enabled: "启用", disabled: "禁用",
  not_installed: "未安装", invalid: "无效", missing: "缺失",
};
const STATE_CLASS = {
  enabled: "ok", disabled: "dim",
  not_installed: "dim", invalid: "err", missing: "warn",
};

async function loadApps() {
  if (appsInFlight) return;
  appsInFlight = true;
  $("apps").setAttribute("aria-busy", "true");
  try {
    appsCache = await j("/api/admin/apps");
    const tbody = $("apps-body");
    tbody.innerHTML = "";
    if (!appsCache.length) {
      setBody("#apps-body",
        '<tr><td colspan="3">没有已注册应用；把应用放进 apps/ 目录后，在上方输入 id 安装</td></tr>');
    }
    for (const a of appsCache) {
      const tr = document.createElement("tr");
      tr.className = "clickable";
      tr.tabIndex = 0;
      tr.dataset.id = a.id;
      const label = STATE_LABEL[a.state] || a.state;
      const pillClass = STATE_CLASS[a.state] || "dim";
      const registered = a.state === "enabled" || a.state === "disabled";
      const nameCell = registered
        ? '<a href="/apps/' + esc(a.id) + '/" target="_blank" rel="noopener noreferrer" title="打开应用">' + esc(a.name) + '</a>' +
          ' <code class="muted">' + esc(a.id) + '</code>' +
          '<div class="mono muted">' + esc(a.entry) + '</div>'
        : '<span>' + esc(a.name) + '</span>' +
          ' <code class="muted">' + esc(a.id) + '</code>' +
          (a.error ? '<div class="mono muted">' + esc(a.error) + '</div>' : '');
      // 状态 → 动词矩阵（数据模型 §9）
      const acts = [];
      if (a.state === "enabled") {
        acts.push('<button data-act="disable" title="禁用后能力 API 返回 APP_NOT_FOUND，静态页面仍可访问">禁用</button>');
      }
      if (a.state === "disabled") {
        acts.push('<button data-act="enable" title="恢复能力 API 访问">启用</button>');
      }
      if (a.state === "enabled" || a.state === "disabled" || a.state === "missing") {
        acts.push('<button data-act="uninstall" title="注销应用并删除签名 token；产物与数据目录保留，重装即恢复">卸载</button>');
      }
      if (a.state === "not_installed") {
        acts.push('<button data-act="install" title="校验清单并注册（注册为启用）">安装</button>');
      }
      acts.push('<button data-act="delete" class="danger" title="删除产物目录与数据目录；不可逆">删除</button>');
      tr.innerHTML =
        "<td>" + nameCell + "</td>" +
        '<td><span class="pill ' + pillClass + '">' + esc(label) + "</span></td>" +
        "<td>" + acts.join(" ") + "</td>";
      tbody.appendChild(tr);
    }
    $("app-count").textContent = appsCache.length ? "共 " + appsCache.length + " 个" : "";
    tbody.querySelectorAll("button[data-act]").forEach((b) => {
      b.addEventListener("click", async (ev) => {
        ev.stopPropagation();
        const id = b.closest("tr").dataset.id;
        const act = b.getAttribute("data-act");
        if (act === "uninstall" &&
            !confirm("卸载 " + id + "：注销应用并删除签名 token；产物与数据目录保留，重装即恢复。继续？")) return;
        if (act === "delete" &&
            !confirm("删除 " + id + "：移除产物目录与全部数据目录，不可恢复。确定删除？")) return;
        try {
          // delete 是 DELETE /api/admin/apps/{id}；其余为 POST /api/admin/apps/{id}/{act}
          const url = act === "delete"
            ? "/api/admin/apps/" + encodeURIComponent(id)
            : "/api/admin/apps/" + encodeURIComponent(id) + "/" + act;
          await j(url, { method: act === "delete" ? "DELETE" : "POST" });
          await refreshAll();
        } catch (e) {
          alert((e.code ? e.code + " " : "") + e.message);
        }
      });
    });
    // 应用过滤下拉：保留当前选择
    const sel = $("f-app");
    const current = sel.value;
    sel.innerHTML = '<option value="">全部应用</option>' +
      appsCache.map((a) => '<option value="' + esc(a.id) + '">' + esc(a.id) + "</option>").join("");
    sel.value = current;
    $("status").textContent = "更新于 " + new Date().toLocaleTimeString();
  } catch (e) {
    setBody("#apps-body", "");
    $("apps-body").appendChild(errorRow(3, e, loadApps));
    $("status").textContent = "刷新失败";
  } finally {
    $("apps").removeAttribute("aria-busy");
    appsInFlight = false;
  }
}

$("install").addEventListener("click", async () => {
  const id = $("install-id").value.trim();
  if (!id) return;
  $("install-msg").textContent = "安装中…";
  try {
    await j("/api/admin/apps/" + encodeURIComponent(id) + "/install", { method: "POST" });
    $("install-msg").textContent = "已安装 " + id;
    $("install-id").value = "";
    await refreshAll();
  } catch (e) {
    $("install-msg").innerHTML =
      '<span class="pill err">' + esc(e.code || "ERROR") + "</span> " + esc(e.message || e);
  }
});
$("install-id").addEventListener("keydown", (ev) => {
  if (ev.key === "Enter") $("install").click();
});

$("upload-package").addEventListener("click", () => $("package").click());
$("package").addEventListener("change", async () => {
  const file = $("package").files[0];
  if (!file) return;
  $("install-msg").textContent = "上传安装中: " + file.name;
  try {
    const form = new FormData();
    form.append("file", file, file.name);
    const d = await j("/api/admin/apps/package", { method: "POST", body: form });
    $("install-msg").textContent = "已安装 " + (d && d.id ? d.id : file.name);
    $("package").value = "";
    await refreshAll();
  } catch (e) {
    $("install-msg").innerHTML =
      '<span class="pill err">' + esc(e.code || "ERROR") + "</span> " + esc(e.message || e);
  }
});

// ---------- 应用详情模态框 ----------

function usageLine(label, used, max, count, unit) {
  const pct = max > 0 ? Math.min(100, Math.round((used / max) * 100)) : 0;
  const over = used > max;
  return (
    '<div class="usage-row"><span class="usage-label">' + label + "</span>" +
    '<span class="usage-bar" aria-hidden="true"><span class="usage-fill" style="width:' + pct + "%;" +
      (over ? "background:var(--err)" : "") + '"></span></span>' +
    '<span class="usage-num mono">' + fmtBytes(used) + " / " + fmtBytes(max) + "（" + pct + "%）" +
    " · " + count + " " + unit + "</span></div>"
  );
}

let lastFocused = null;

async function openModal(id) {
  lastFocused = document.activeElement;
  $("modal-title").textContent = id;
  $("modal-body").innerHTML = '<div class="muted">读取详情中…</div>';
  $("modal").hidden = false;
  $("modal-close").focus();
  try {
    const d = await j("/api/admin/apps/" + encodeURIComponent(id));
    const label = STATE_LABEL[d.state] || d.state || "—";
    const perms = [
      ["store", d.permissions.store], ["files", d.permissions.files],
      ["shim", d.permissions.shim],
    ].map(([k, v]) => k + ": " + v)
     .concat(
       d.permissions.net.length ? ["net: " + d.permissions.net.join(", ")] : [],
       d.permissions.ws.length ? ["ws: " + d.permissions.ws.join(", ")] : []
     );
    $("modal-title").textContent = d.name + "（" + d.id + "）";
    $("modal-body").innerHTML =
      '<table class="kv-table">' +
      '<tr><td>状态</td><td><span class="pill ' + (STATE_CLASS[d.state] || "dim") + '">' + esc(label) + "</span></td></tr>" +
      '<tr><td>入口</td><td class="mono">' + esc(d.entry) +
        ' <a href="/apps/' + esc(d.id) + '/" target="_blank" rel="noopener noreferrer">打开 ↗</a></td></tr>' +
      '<tr><td>安装时间</td><td>' + (d.installed_at ? esc(new Date(d.installed_at).toLocaleString()) : "—") + "</td></tr>" +
      '<tr><td>产物目录</td><td class="mono">' + esc(d.root) + "</td></tr>" +
      '<tr><td>数据目录</td><td class="mono">' + esc(d.data_dir) + "</td></tr>" +
      "</table>" +
      "<h3>权限</h3>" + '<div class="fact-box">' + perms.map(esc).join("<br>") + "</div>" +
      "<h3>限额（生效）</h3>" + '<div class="fact-box">' +
        esc("kv " + fmtBytes(d.limits.kv_value_bytes) + " / " + fmtBytes(d.limits.kv_total_bytes) +
          " · file " + fmtBytes(d.limits.file_bytes) + " / " + fmtBytes(d.limits.file_total_bytes) +
          " · " + d.limits.net_rps + " rps · sign_ttl " + d.limits.sign_ttl_max + "s") + "</div>" +
      "<h3>实际用量</h3>" +
      usageLine("KV", d.usage.kv.bytes, d.limits.kv_total_bytes, d.usage.kv.keys, "键") +
      usageLine("文件", d.usage.files.bytes, d.limits.file_total_bytes, d.usage.files.count, "个");
  } catch (e) {
    $("modal-body").innerHTML =
      '<span class="pill err">' + esc(e.code || "ERROR") + "</span> " + esc(e.message || e);
  }
}

function closeModal() {
  $("modal").hidden = true;
  if (lastFocused && lastFocused.isConnected) lastFocused.focus();
  lastFocused = null;
}
$("modal-close").addEventListener("click", closeModal);
$("modal-backdrop").addEventListener("click", closeModal);
document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape" && !$("modal").hidden) closeModal();
});
// 焦点圈定：Tab 在模态框内循环
$("modal-card").addEventListener("keydown", (ev) => {
  if (ev.key !== "Tab") return;
  const focusables = $("modal-card")
    .querySelectorAll('button:not(:disabled), a[href], input, select, [tabindex]:not([tabindex="-1"])');
  if (!focusables.length) return;
  const first = focusables[0];
  const last = focusables[focusables.length - 1];
  if (ev.shiftKey && document.activeElement === first) {
    last.focus();
    ev.preventDefault();
  } else if (!ev.shiftKey && document.activeElement === last) {
    first.focus();
    ev.preventDefault();
  }
});

// ---------- 审计日志（双向分页）----------

const OUTCOME_CLASS = { Ok: "ok", Denied: "warn", Error: "err" };
// 分页状态：before/after 固定当前页位置；page 仅用于展示
const logs = { page: 1, before: null, after: null, next: null, prev: null, items: [] };

function logQuery() {
  const q = new URLSearchParams();
  if ($("f-app").value) q.set("app", $("f-app").value);
  if ($("f-action").value) q.set("action", $("f-action").value);
  if ($("f-outcome").value) q.set("outcome", $("f-outcome").value);
  q.set("limit", $("f-limit").value);
  if (logs.before) q.set("before", logs.before);
  if (logs.after) q.set("after", logs.after);
  return q.toString();
}

function renderLogs() {
  const tbody = $("logs-body");
  tbody.innerHTML = "";
  if (!logs.items.length) {
    setBody("#logs-body", '<tr><td colspan="8">暂无事件（过滤条件或时间范围内没有能力调用）</td></tr>');
  }
  for (const e of logs.items) {
    const tr = document.createElement("tr");
    tr.innerHTML =
      '<td class="muted" title="' + esc(new Date(e.ts).toLocaleString()) + '">' + esc(relTime(e.ts)) + "</td>" +
      "<td><code>" + esc(e.app_id || "-") + "</code></td>" +
      "<td>" + esc(e.subject || "-") + "</td>" +
      "<td>" + esc(e.action) + "</td>" +
      '<td class="mono">' + esc(e.target || "-") + "</td>" +
      '<td><span class="pill ' + (OUTCOME_CLASS[e.outcome] || "dim") + '">' + esc(e.outcome) + "</span></td>" +
      '<td class="mono">' + esc(e.error_code || "-") + "</td>" +
      "<td>" + esc(e.duration_ms) + " ms</td>";
    tbody.appendChild(tr);
  }
  $("log-page").textContent = "第 " + logs.page + " 页";
  $("logs-next").disabled = !logs.next;
  $("logs-prev").disabled = !logs.prev;
}

async function loadLogs() {
  if (logsInFlight) return;
  logsInFlight = true;
  $("logs").setAttribute("aria-busy", "true");
  try {
    const page = await j("/api/admin/logs?" + logQuery());
    logs.items = page.items || [];
    logs.next = page.next || null;
    logs.prev = page.prev || null;
    renderLogs();
  } catch (e) {
    setBody("#logs-body", "");
    $("logs-body").appendChild(errorRow(8, e, loadLogs));
  } finally {
    $("logs").removeAttribute("aria-busy");
    logsInFlight = false;
  }
}

$("logs-next").addEventListener("click", () => {
  if (!logs.next) return;
  logs.before = logs.next;
  logs.after = null;
  logs.page += 1;
  loadLogs();
});
$("logs-prev").addEventListener("click", () => {
  if (!logs.prev) return;
  logs.after = logs.prev;
  logs.before = null;
  logs.page = Math.max(1, logs.page - 1);
  loadLogs();
});
for (const id of ["f-app", "f-action", "f-outcome", "f-limit"]) {
  $(id).addEventListener("change", () => {
    logs.page = 1;
    logs.before = null;
    logs.after = null;
    loadLogs();
  });
}

// ---------- 宿主升级（仅手动触发）----------

let lastPhase = null;
let updatePolling = false;

function renderUpdatePhase(v) {
  lastPhase = v;
  $("host-version").textContent = "v" + v.current;
  const msg = $("update-msg");
  const install = $("update-install");
  const restart = $("host-restart");
  install.hidden = true;
  restart.hidden = true;
  const phase = v.phase || {};
  switch (phase.state) {
    case "idle":
      msg.textContent = "更新源: " + (v.source || "未配置");
      break;
    case "checking":
      msg.textContent = "检查更新中…";
      break;
    case "up_to_date":
      msg.textContent = "已是最新版本";
      break;
    case "available":
      msg.innerHTML = "发现新版本 <strong>" + esc(phase.version) + "</strong>（" +
        fmtBytes(phase.size) + "）" +
        (phase.notes_url
          ? ' <a href="' + esc(phase.notes_url) + '" target="_blank" rel="noopener noreferrer">更新日志 ↗</a>'
          : "");
      install.hidden = false;
      break;
    case "downloading":
      msg.textContent = "下载 " + phase.version + " " + fmtBytes(phase.bytes) + " / " + fmtBytes(phase.total);
      break;
    case "installing":
      msg.textContent = "安装 " + phase.version + " …";
      break;
    case "restart_pending":
      msg.textContent = "新版本 " + esc(phase.version) + " 已就位，重启宿主后生效";
      restart.hidden = false;
      break;
    case "failed":
      msg.innerHTML = '<span class="pill err">失败</span> ' + esc(phase.error);
      break;
    default:
      msg.textContent = "";
  }
}

async function pollUpdateOnce() {
  try {
    renderUpdatePhase(await j("/api/admin/update/status"));
  } catch (e) {
    $("update-msg").textContent = "状态获取失败: " + (e.message || e);
  }
}

// 检查/下载/安装期间 1s 轮询，进入终态即停
async function pollWhileActive() {
  if (updatePolling) return;
  updatePolling = true;
  for (;;) {
    await pollUpdateOnce();
    const state = (lastPhase && lastPhase.phase && lastPhase.phase.state) || "";
    if (!["checking", "downloading", "installing"].includes(state)) break;
    await new Promise((r) => setTimeout(r, 1000));
  }
  updatePolling = false;
}

$("update-check").addEventListener("click", async () => {
  try {
    await j("/api/admin/update/check", { method: "POST" });
  } catch (e) {
    $("update-msg").innerHTML = '<span class="pill err">' + esc(e.code || "ERROR") + "</span> " + esc(e.message || e);
    return;
  }
  pollWhileActive();
});
$("update-install").addEventListener("click", async () => {
  try {
    await j("/api/admin/update/install", { method: "POST" });
  } catch (e) {
    $("update-msg").innerHTML = '<span class="pill err">' + esc(e.code || "ERROR") + "</span> " + esc(e.message || e);
    return;
  }
  pollWhileActive();
});
$("host-restart").addEventListener("click", async () => {
  if (!confirm("重启宿主进程？短暂中断后自动恢复（页面会自动重连）。")) return;
  try {
    await j("/api/admin/host/restart", { method: "POST" });
    $("update-msg").textContent = "重启中…";
  } catch (e) {
    $("update-msg").innerHTML = '<span class="pill err">' + esc(e.code || "ERROR") + "</span> " + esc(e.message || e);
  }
});

// ---------- 刷新 ----------

let appsInFlight = false;
let logsInFlight = false;

function loadStatus() {
  j("/api/admin/status").then((s) => {
    $("server-info").textContent =
      "v" + s.version + " · " + s.mode + " · " + s.listen +
      " · 运行 " + Math.round(s.uptime_secs / 60) + " 分钟" +
      (s.audit_dropped ? " · 审计丢弃 " + s.audit_dropped : "");
  }).catch(() => {
    $("server-info").textContent = "";
  });
}

async function refreshAll() {
  await Promise.allSettled([loadApps(), loadLogs(), loadStatus(), pollUpdateOnce()]);
}

$("refresh").addEventListener("click", refreshAll);
setInterval(() => {
  if (document.visibilityState !== "visible" || appsInFlight || logsInFlight) return;
  // 停留在第 1 页时才自动刷新日志（翻页中游标固定位置，避免跳动）
  if (logs.page === 1) {
    Promise.allSettled([loadApps(), loadLogs(), loadStatus()]);
  } else {
    loadApps();
  }
}, 10_000);

// 行点击 / 回车打开详情
$("apps-body").addEventListener("click", (ev) => {
  if (ev.target.closest("button") || ev.target.closest("a")) return;
  const tr = ev.target.closest("tr[data-id]");
  if (tr) openModal(tr.dataset.id);
});
$("apps-body").addEventListener("keydown", (ev) => {
  if (ev.key !== "Enter" && ev.key !== " ") return;
  if (ev.target.closest("button") || ev.target.closest("a")) return;
  const tr = ev.target.closest("tr[data-id]");
  if (tr) {
    ev.preventDefault();
    openModal(tr.dataset.id);
  }
});

refreshAll();
</script>
